[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "task-state-guard"
version = "0.1.0"
description = "Preview and safely reconcile stale task and delivery records in a SQLite ledger after agent timeouts or restarts, without marking unknown work successful."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TaskStateGuard contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "agent-runtime",
  "ai-agents",
  "delivery-state",
  "restart-reconciliation",
  "sqlite",
  "stale-tasks",
  "task-state-machine",
  "task-state-reconciliation",
  "terminal-state",
  "timeout-reconciliation",
  "workflow-observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MaxHu-xuan/task-state-guard"
Documentation = "https://github.com/MaxHu-xuan/task-state-guard#readme"
Repository = "https://github.com/MaxHu-xuan/task-state-guard"
Issues = "https://github.com/MaxHu-xuan/task-state-guard/issues"
Changelog = "https://github.com/MaxHu-xuan/task-state-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/MaxHu-xuan/task-state-guard/security/policy"

[project.scripts]
task-state-guard = "task_state_guard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
