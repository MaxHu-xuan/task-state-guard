name: Feature request
description: Propose a user outcome within the public task-state ledger boundary.
title: "[Feature] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Start with the workflow problem and the result you need. TaskStateGuard records and reconciles state; it does not schedule, execute, retry, or deliver tasks. Proposals must preserve privacy-minimal storage and fail-closed filesystem boundaries.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary checks
      options:
        - label: The proposal uses synthetic examples and contains no confidential data.
          required: true
        - label: The proposal does not require storing task bodies, prompts, credentials, paths, or free-form error text.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe what an operator or integrator cannot currently determine or reconcile, without private deployment details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired result
      description: Explain the observable outcome first, then define inputs, outputs, state transitions, failure behavior, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any approach that belongs in the surrounding queue, worker, retry, workflow, or transport layer instead.
    validations:
      required: true
