name: Bug report
description: Report an incorrect task, delivery, restart-recovery, or doctor result.
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Never attach a production database or include private task content, identifiers, fingerprints, paths, credentials, or logs. Use generated UUIDs and synthetic values.
  - type: checkboxes
    id: safety
    attributes:
      label: Safe reproduction
      options:
        - label: I confirm this report and every attachment contain synthetic, non-confidential data only.
          required: true
        - label: I checked that this is not a security vulnerability requiring private reporting.
          required: true
  - type: input
    id: version
    attributes:
      label: TaskStateGuard version or commit
      placeholder: 0.1.0 or a short public commit identifier
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the result that did not match the documented contract.
      options:
        - Task lifecycle or terminal state
        - Timeout or restart reconciliation
        - Delivery state
        - Dry-run preview
        - Doctor or workflow observability
        - SQLite, path, or permission safety
        - Packaging or cross-platform behavior
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: CPython 3.12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Show the state before the action, the action, and the result using generated values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: State which task, delivery, preview, or doctor outcome you expected and why.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Summarize the outcome without pasting private paths, values, or database content.
    validations:
      required: true
